<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SoloTrackr</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%;
      background: #050505; color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .wrap { text-align: center; padding: 24px; }
    .mark {
      width: 76px; height: 76px; margin: 0 auto 20px;
      border-radius: 20px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      box-shadow: 0 12px 40px rgba(37, 99, 235, 0.35);
      font-size: 40px; font-weight: 900; font-style: italic; color: #fff;
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    }
    h1 { font-size: 15px; font-weight: 900; letter-spacing: 0.28em; text-transform: uppercase; margin: 0 0 6px; }
    p  { font-size: 11px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: #71717a; margin: 0; }
    .spinner {
      width: 26px; height: 26px; margin: 22px auto 0;
      border: 3px solid rgba(255,255,255,0.15); border-top-color: #3b82f6;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { display: none; }
    .failed .err { display: block; }
    .failed .busy { display: none; }
    button {
      margin-top: 22px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 14px;
      background: #2563eb; color: #fff; font: inherit; font-size: 13px; font-weight: 800;
      letter-spacing: 0.12em; text-transform: uppercase;
    }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">S</div>
    <h1>SoloTrackr</h1>
    <div class="busy">
      <p>Connecting to markets…</p>
      <div class="spinner"></div>
    </div>
    <div class="err">
      <p id="msg">Can't reach SoloTrackr</p>
      <button type="button" id="retry">Try again</button>
    </div>
  </div>
  <script>
    // Shown by Capacitor (server.errorPath) when the remote app can't load, and
    // as the first paint. MUST match CAP_SERVER_URL / the fallback in
    // capacitor.config.ts.
    var SERVER_URL = "https://solo-trackr.vercel.app";
    var msg = document.getElementById("msg");

    function go() { window.location.replace(SERVER_URL); }

    function fail() {
      document.body.classList.add("failed");
      msg.textContent = navigator.onLine ? "Can't reach SoloTrackr" : "You're offline";
    }

    document.getElementById("retry").addEventListener("click", function () {
      document.body.classList.remove("failed");
      go();
    });
    // Coming back online is the common recovery — retry without a tap.
    window.addEventListener("online", function () { if (document.body.classList.contains("failed")) go(); });
    // If we're still here after a few seconds the remote did not take over.
    setTimeout(fail, 8000);
  </script>
</body>
</html>
